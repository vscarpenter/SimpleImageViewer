name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # GitHub public preview: macOS 27 and Xcode 27 on Apple silicon.
    runs-on: xcode-27
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Verify macOS 27 toolchain
      run: bash scripts/check-macos-toolchain.sh
    
    - name: Build
      run: |
        xcodebuild -project "StillView - Simple Image Viewer.xcodeproj" \
                   -scheme "StillView - Simple Image Viewer" \
                   -configuration Debug \
                   -destination "platform=macOS" \
                   build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO

    - name: Verify regression test target
      run: python3 scripts/check-test-target.py
    
    - name: Run Tests
      run: |
        xcodebuild test \
          -project "StillView - Simple Image Viewer.xcodeproj" \
          -scheme "StillView - Simple Image Viewer" \
          -destination "platform=macOS" \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
