name: CodeQL

# Paused: CodeQL's traced Swift builds don't work with Xcode 27 or on macOS 27, because
# Apple dropped the Intel-compatible binaries the tracer needs (CodeQL 2.27.2 release
# notes; https://github.com/github/codeql/issues/22742). This app requires the macOS 27
# SDK, so every run ended in a configuration error without scanning anything.
# Run it manually from the Actions tab to check for support. Once a CodeQL release
# supports Xcode 27, restore these triggers:
#   push and pull_request on main, and schedule cron '0 7 * * 1'.
on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (Swift)
    # GitHub public preview: macOS 27 and Xcode 27 on Apple silicon.
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify macOS 27 toolchain
        run: bash scripts/check-macos-toolchain.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift

      # Prefer manual build for Swift projects to avoid signing issues
      - name: Build (CodeQL)
        run: |
          xcodebuild -project "StillView - Simple Image Viewer.xcodeproj" \
                     -scheme "StillView - Simple Image Viewer" \
                     -configuration Debug \
                     -destination "platform=macOS" \
                     clean build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

